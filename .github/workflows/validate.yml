name: Validate classroom
on:
  push:
    branches: [main]
    paths-ignore:
      - 'static/audio/**'
      - 'static/videos/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classroom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends --yes ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            data-src/course-videos/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix data-src/course-videos
      - run: npm run audit:security
      - run: npm run build
      - run: npm test
  validate-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends --yes ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: data-src/inferencia-estadistica/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/tts/requirements.txt
      - run: npm ci --ignore-scripts --prefix data-src/inferencia-estadistica
      - run: python -m pip install -r scripts/tts/requirements.txt
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s scripts/tts -p 'test_*.py' -v