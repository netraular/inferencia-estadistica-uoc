name: Validate classroom
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
  validate-tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: data-src/inferencia-estadistica/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/tts/requirements.txt
      - run: npm ci --ignore-scripts --prefix data-src/inferencia-estadistica
      - run: python -m pip install -r scripts/tts/requirements.txt
      - run: python -m unittest discover -s scripts/tts -p 'test_*.py' -v